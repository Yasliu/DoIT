name: Production Release Build
on:
  push:
    tags:
      # Plain versions only. This job signs for the updater, so a beta tag must never start it;
      # betas go through checks.yml.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Stable Rust Engine
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build and Package Tauri Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DoIT Desktop Core ${{ github.ref_name }}'
          releaseBody: 'DoIT ${{ github.ref_name }} — Real-time live card preview while typing, reliable keystroke saving in note bodies, guaranteed collision-free per-note file storage, and persistent deletion for open notes.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
