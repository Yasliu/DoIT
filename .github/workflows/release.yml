name: Production Release Build
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Stable Rust Engine
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build and Package Tauri Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DoIT Desktop Core ${{ github.ref_name }}'
          releaseBody: 'DoIT v1.1.4 - Fixes: Font Presets dropdown now stays inside the window (docked editor, maximized view and desk tray). Includes: update-check retries with a manual Check for updates button in Settings, category name limit with fade, key-cap shortcut fields, larger desk tray, faster image viewer, single-frame low-memory tray mode.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
