name: Production Release Build
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Stable Rust Engine
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build and Package Tauri Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DoIT Desktop Core ${{ github.ref_name }}'
          releaseBody: 'DoIT v1.2.0 - Official Linux support (Fedora .rpm with in-app updates and universal Linux .AppImage), modern UI redesign with 7 themes, Glass and Boxy styling modes, Spotlight-style quick search (Ctrl+K), persistent dock always-on-top architecture across drags and desktop focus, and toolbar outside-click mutual dismissal.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
