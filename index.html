<!doctype html>
<html lang="en" style="margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; scrollbar-width: none; background: transparent !important; background-color: transparent !important;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DoIT</title>
    <style>
      html, body, #root {
        background: transparent !important;
        background-color: transparent !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
      }
      * {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }
      *::-webkit-scrollbar,
      ::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      body, html {
        overflow: hidden !important;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        pointer-events: none;
        transition: opacity 140ms ease-out;
      }
      #boot[hidden] {
        display: none;
      }
      #boot img {
        width: 72px;
        height: 72px;
      }
      *, *::before, *::after {
        -webkit-tap-highlight-color: transparent !important;
        outline: none !important;
        box-shadow: none !important;
        -webkit-focus-ring-color: transparent !important;
      }
      *:hover, *:focus, *:focus-visible, *:focus-within, *:active {
        outline: none !important;
        box-shadow: none !important;
        ring: 0 !important;
        -webkit-focus-ring-color: transparent !important;
      }
    </style>
  </head>

  <body style="margin: 0; padding: 0; background: transparent !important; background-color: transparent !important; overflow: hidden; width: 100%; height: 100%; user-select: none; scrollbar-width: none;">
    <div id="root" style="width: 100%; height: 100%; overflow: hidden; background: transparent !important; background-color: transparent !important;"></div>
    <div id="boot" hidden><img src="/logo.png" alt="" /></div>
    <script>
      // The canvas's launch screen, painted before any bundle loads, in the last theme's colour.
      (function () {
        if (location.search.indexOf("window=tray") >= 0) return;
        var boot = document.getElementById("boot");
        var dark = matchMedia("(prefers-color-scheme: dark)").matches;
        try {
          boot.style.background = localStorage.getItem("doit.boot-canvas") || (dark ? "#0b0c0f" : "#fafafa");
        } catch (e) {
          boot.style.background = dark ? "#0b0c0f" : "#fafafa";
        }
        boot.hidden = false;
        var ipc = window.__TAURI_INTERNALS__;
        if (!ipc) return;
        // Not through tauriBridge: this runs before the bundle exists.
        var painted = false;
        var maximized = null;
        // A maximized window grows after it maps, and its first frame is the small size. It waits
        // for the app to mount (App reveals it) instead of showing that.
        var reveal = function () {
          if (!painted || maximized !== false) return;
          reveal = function () {};
          ipc.invoke("canvas_ready");
        };
        ipc.invoke("canvas_loading").then(function (willMaximize) {
          maximized = willMaximize;
          reveal();
        });
        try {
          new PerformanceObserver(function () {
            painted = true;
            reveal();
          }).observe({ type: "paint", buffered: true });
        } catch (e) {
          /* App reveals the window when it mounts */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
